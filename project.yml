name: IslandHub
options:
  bundleIdPrefix: com.islandhub
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Change this one value to your own reverse-domain ID; everything else derives from it.
    APP_BUNDLE_ID: com.matsavin.pixelpals
targets:
  IslandHub:
    type: application
    platform: iOS
    sources: [IslandHub, Shared]
    info:
      path: IslandHub/Info.plist
      properties:
        CFBundleDisplayName: Pixel Pals
        CFBundleLocalizations: [en, ru]
        ITSAppUsesNonExemptEncryption: false
        AppGroupID: group.$(APP_BUNDLE_ID)
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: IslandHub/IslandHub.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: IslandWidget
  IslandWidget:
    type: app-extension
    platform: iOS
    sources: [IslandWidget, Shared]
    info:
      path: IslandWidget/Info.plist
      properties:
        CFBundleDisplayName: Pixel Pals
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: group.$(APP_BUNDLE_ID)
    entitlements:
      path: IslandWidget/IslandWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
