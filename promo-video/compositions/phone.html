  <script>
    const tl = gsap.timeline({ paused: true });

    // A different pal on each beat; the island and the big pet always match.
    // [time, face, pop?] — the pops line up with the soundtrack's blips.
    const faces = [
      [0.15, "cat-happy", true], // hook: Mochi the cat
      [2.6, "frog-happy", true], // feelings: happy
      [3.25, "dog-idle", true], // hungry
      [3.9, "penguin-blink", true], // sleepy
      [4.55, "bunny-sad", true], // sad
      [5.2, "axolotl-happy", true], // in love
      [6.0, "dino-idle", true], // care: Rexie the dino munches and plays
      [6.75, "dino-happy", false],
      [6.9, "dino-idle", false],
      [7.05, "dino-happy", false],
      [7.2, "dino-idle", false],
      [7.35, "dino-happy", false],
      [9.25, "bunny-bow", true], // outfits
      [9.85, "frog-sunglasses", true],
      [10.45, "ghost-partyhat", true],
      [11.05, "dog-crown", true], // Kuma in his crown...
      [11.5, "dog-crown-blink", false], // ...falls asleep with the phone
    ];
    const allFaces = "#phone-big-pet .phone-face, #phone-isl-tilt .phone-face";
    // The opening face is also set in the markup, so frame 0 (the thumbnail) already shows Kuma.
    for (const [t, face, pop] of faces) {
      // Nothing to swap at 0: the markup already shows the opening face, and stacked sets at
      // exactly 0 don't replay when the renderer seeks there.
      if (t > 0) {
        tl.set(allFaces, { opacity: 0 }, t);
        tl.set(`#big-${face}, #isl-${face}`, { opacity: 1 }, t);
      }
      if (pop) {
        tl.fromTo(
          "#phone-big-pet, #phone-isl-pet",
          { scale: 0.72 },
          { scale: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false },
          t,
        );
      }
    }

    // Curious head tilt in the island while the phone is in use; level when sad or asleep.
    tl.set("#phone-isl-tilt", { rotation: -10 }, 0);
    tl.set("#phone-isl-tilt", { rotation: 0 }, 4.55);
    tl.set("#phone-isl-tilt", { rotation: -10 }, 5.2);
    tl.set("#phone-isl-tilt", { rotation: 0 }, 11.5);

    // Gentle idle bob during the hook, a hop while playing ball.
    tl.fromTo(
      "#phone-big-pet",
      { y: 0 },
      { y: -16, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false },
      0.3,
    );
    tl.fromTo(
      "#phone-big-pet",
      { y: 0 },
      { y: -70, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 3, immediateRender: false },
      7.5,
    );

    // The phone goes to sleep: the screen dims to Always-On and Kuma closes its eyes.
    tl.fromTo("#phone-dim", { opacity: 0 }, { opacity: 0.6, duration: 0.4, ease: "power2.inOut" }, 11.45);

    window.__timelines["phone"] = tl;
  </script>
